[project]
name = "shieldpulse-api"
version = "0.1.0"
description = "FastAPI backend for the ShieldPulse mobile analytics case study."
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10.4",
  "feedparser>=6.0.11",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2.6",
  "pydantic-settings>=2.7.1",
  "python-dateutil>=2.9.0.post0",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.39",
  "uvicorn>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25.3"
]

[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"
